<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<header>
    <nav class="navbar">
        <h1 class="logo">Dashboard</h1>
        <div class="navlink">
            <a href="index.html">Home</a>
            <a href="log.html">Log Lap</a>
            <a href="analytics.html">Analytics</a>
        </div>
    </nav>
</header>

<main>
    <section class="grid">
        <div class="laps">
            <h3>Total Laps Logged</h3>
            <div class="value" id="total-laps">
                0
            </div>
        </div>

        <div class="laps">
            <h3>Overall Fastest Lap</h3>
            <div class="laptime" id="fastest-lap">
                --
            </div>
        </div>
    </section>

    <section>
        <h2>Recent Telemetry</h2>
        <table>
            <thead>
                <tr>
                    <th>Driver</th>
                    <th>Tyre</th>
                    <th>Time</th>
                </tr>
            </thead>
            <tbody id="table">

            </tbody>
        </table>
    </section>
</main> 
<footer>
    <p>&copy;2026 Paddock Pass Telemetry</p>
</footer>   
</body>
</html>
