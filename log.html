<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log Lap</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <nav class="navbar">
        <h1>Log Lap</h1>
        <div class="navlink">
            <a href="index.html">Home</a>
            <a href="dashboard.html">Dashboard</a>
            <a href="analytics.html">Analytics</a>
        </div>
    </nav>
    </header>

    <main>
        <section class="card">
            <h1 class="logo">Log a Lap</h1>
            <form id="form">
                <div class="input1">
                    <label for="driver">Driver Name</label>
                    <input type="text" id="driver" name="driver" placeholder="e.g,  Verstappen" required>
                </div>

                <div class="input">
                    <label for="time">Lap Time</label>
                    <input type="number" id="time" name="time" step="0.001" placeholder="eg, 49.834" required>
                </div>

                <div class="input1">
                    <label for="compound">Tyre Compound</label>
                    <select id="compound" name="compound" required>
                        <option value="Soft">Soft (Red)</option>
                        <option value="Medium">Medium (Yellow)</option>
                        <option value="Hard">Hard (White)</option>
                    </select>
                </div>
                <button type="submit">Save to Telemetry</button>
            </form>

        </section>
    </main>
    <footer>
        <p>&copy; 2026 Paddock Pass Telemetry</p>
    </footer>
</body>
</html>
